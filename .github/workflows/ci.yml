name: CI Test on PR

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:latest
        environment:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run application and test connection
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: rootpassword
          DB_NAME: test
        run: |
          # Lance l'application Flask en arrière-plan
          python app.py &
          
          # Attends que l'application démarre
          sleep 3
          
          # Teste la page d'accueil et vérifie la chaîne de caractères attendue
          response=$(curl -s http://localhost:5000/)
          echo "Response received: $response"
          
          if [[ "$response" == *"Database Connection Status: Connected"* ]]; then
            echo "Test passed successfully!"
            exit 0
          else
            echo "Test failed!"
            exit 1
          fi